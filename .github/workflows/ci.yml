name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and security scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/ai/requirements.txt
      - name: Install Tesseract OCR with Urdu (for the OCR tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-urd
      - name: Install dependencies
        # AI libraries for the fast AI tests. sentence-transformers (and torch) are NOT installed:
        # the fast tests use a small fake embedder, so no AI model is downloaded in CI.
        run: pip install -r backend/requirements-dev.txt bandit pip-audit faiss-cpu numpy pyyaml jinja2 scikit-learn pytesseract
      - name: Unit tests (API, security and AI modules)
        working-directory: backend
        run: pytest -q tests ai
      - name: Bandit (static security scan, medium severity and above)
        run: bandit -r backend --exclude backend/tests,backend/.venv -ll
      - name: Dependency audit (known vulnerabilities)
        run: pip-audit -r backend/requirements.txt

  web:
    name: Web checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: pip install pyyaml pytest
      - name: Static checks (CSP, ids, file references)
        run: python tools/check_web.py
      - name: JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/site.js
          node --check web/sw.js
      - name: Pages match the generator
        run: |
          python tools/build_pages.py
          git diff --exit-code -- web
      - name: Tests for the tools
        run: python -m pytest tools/tests -q

  packs:
    name: Procedure packs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - name: Validate packs
        run: python tools/validate_packs.py

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Lint the Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: backend/Dockerfile
      - name: Build the image (downloads PyTorch and the search model)
        run: docker build -f backend/Dockerfile -t haqdar-api:ci .
      - name: Run it locked down and check real answers
        run: |
          docker run -d --name haqdar-api \
            --read-only --tmpfs /tmp:size=64m,noexec,nosuid,nodev \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --memory 2g --cpus 2 --pids-limit 256 \
            -p 127.0.0.1:8000:8000 haqdar-api:ci
          for i in $(seq 1 120); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health
          echo
          curl -sI http://127.0.0.1:8000/health | grep -i "x-content-type-options: nosniff"
          curl -fsS -X POST http://127.0.0.1:8000/ask -H "content-type: application/json" \
            -d '{"question":"My electricity meter is running fast, what should I do?","lang":"en"}' \
            | python3 -c "import sys, json; d = json.load(sys.stdin); assert d['abstained'] is False and d['pack_id'] == 'electricity_bill_dispute', d; print('real answer from pack', d['pack_id'])"
          curl -fsS -X POST http://127.0.0.1:8000/ask -H "content-type: application/json" \
            -d '{"question":"What is the weather in Lahore?","lang":"en"}' \
            | python3 -c "import sys, json; d = json.load(sys.stdin); assert d['abstained'] is True, d; print('out-of-scope question refused')"
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          img = Image.new("RGB", (1700, 260), "white")
          ImageDraw.Draw(img).text((40, 40), "Pay Rs 5000 by 30 November 2026", fill="black", font=ImageFont.load_default(size=60))
          img.save("notice.png")
          PY
          curl -fsS -F "file=@notice.png;type=image/png" http://127.0.0.1:8000/extract \
            | python3 -c "import sys, json; d = json.load(sys.stdin); assert '5000' in d['text'], d; print('photo read inside the container:', d['text'][:60])"
          test "$(docker exec haqdar-api id -u)" = "10001"
          echo "container runs as user 10001"
      - name: Show container logs
        if: always()
        run: docker logs haqdar-api || true
      - name: Clean up
        if: always()
        run: docker rm -f haqdar-api || true

  image-scan:
    name: Image vulnerability scan (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Reported but not blocking: a large AI image will often list known issues in its libraries.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -f backend/Dockerfile -t haqdar-api:ci .
      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: haqdar-api:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
