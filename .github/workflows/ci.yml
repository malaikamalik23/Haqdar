name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and security scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/ai/requirements.txt
      - name: Install Tesseract OCR with Urdu (for the OCR tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-urd
      - name: Install dependencies
        # AI libraries for the fast AI tests. sentence-transformers (and torch) are NOT installed:
        # the fast tests use a small fake embedder, so no AI model is downloaded in CI.
        run: pip install -r backend/requirements-dev.txt bandit pip-audit faiss-cpu numpy pyyaml jinja2 scikit-learn pytesseract
      - name: Unit tests (API, security and AI modules)
        working-directory: backend
        run: pytest -q tests ai
      - name: Bandit (static security scan, medium severity and above)
        run: bandit -r backend --exclude backend/tests,backend/.venv -ll
      - name: Dependency audit (known vulnerabilities)
        run: pip-audit -r backend/requirements.txt

  web:
    name: Web checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: pip install pyyaml pytest
      - name: Static checks (CSP, ids, file references)
        run: python tools/check_web.py
      - name: JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/site.js
          node --check web/sw.js
      - name: Pages match the generator
        run: |
          python tools/build_pages.py
          git diff --exit-code -- web
      - name: Tests for the tools
        run: python -m pytest tools/tests -q

  packs:
    name: Procedure packs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - name: Validate packs
        run: python tools/validate_packs.py

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Lint the Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: backend/Dockerfile
      - name: Build the image
        run: docker build -f backend/Dockerfile -t haqdar-api:ci .
      - name: Run it locked down and check it
        run: |
          docker run -d --name haqdar-api \
            --read-only --tmpfs /tmp:size=16m,noexec,nosuid,nodev \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --memory 512m --cpus 1 --pids-limit 128 \
            -p 127.0.0.1:8000:8000 haqdar-api:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health
          echo
          curl -sI http://127.0.0.1:8000/health | grep -i "x-content-type-options: nosniff"
          curl -fsS -X POST http://127.0.0.1:8000/ask -H "content-type: application/json" \
            -d '{"question":"hello","lang":"en"}' > /dev/null
          echo "ask endpoint answers"
          test "$(docker exec haqdar-api id -u)" = "10001"
          echo "container runs as user 10001"
      - name: Show container logs
        if: always()
        run: docker logs haqdar-api || true
      - name: Clean up
        if: always()
        run: docker rm -f haqdar-api || true

  image-scan:
    name: Image vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -f backend/Dockerfile -t haqdar-api:ci .
      - name: Scan with Trivy (fixable high and critical issues fail the check)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: haqdar-api:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"