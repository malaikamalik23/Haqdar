# Pack: Electricity bill dispute
# Source: NEPRA Consumer Service Manual (CSM) 2020, official PDF on nepra.org.pk
# Rule: every step must have a source_id that matches an entry in "sources".
# Rule: every source must be an official website (nepra.org.pk or *.gov.pk).
# REVIEW NOTE: quotes must be checked word-for-word against the PDF (Ctrl+F),
# and against the CSM revised 2025 if its clauses changed.

id: electricity_bill_dispute
title_ur: "بجلی کے بل پر اعتراض"
title_en: "Disputing an electricity bill"

# Optional: extra search words (Roman Urdu / English) to help retrieval match user questions.
# Optional: if a question contains one of these, this pack is skipped (other utilities / services).
exclude_keywords: [gas, sui, sngpl, ssgc, pani, water, ptcl, telephone, internet]
keywords: [bijli, bijlee, bill, meter, tez, zyada, ziada, shikayat, complaint, nepra, wapda, disco, iesco, lesco, mepco, fesco, gepco, pesco, hesco, sepco, qesco, tesco, units, reading]

office: "اپنی بجلی کمپنی (DISCO) کا سب ڈویژن (SDO) دفتر؛ میٹر کے تنازعے کے لیے صوبائی دفتر معائنہ (Electric Inspector / POI)؛ نیپرا (NEPRA)"

documents_needed:
  - "متنازعہ بل کی کاپی (Copy of the disputed bill)"
  - "بل پر درج 14 ہندسوں کا ریفرنس نمبر (14-digit reference number from the bill)"
  - "شناختی کارڈ کی کاپی (CNIC copy)"
  - "پچھلے چند ماہ کے بل، اگر موجود ہوں (Previous months' bills, if available)"

steps:
  - id: step_1
    text_ur: "اپنا بل غور سے دیکھیں: بل جاری ہونے کی تاریخ سے 15 دن کے اندر ادائیگی کی آخری تاریخ ہوتی ہے۔"
    text_en: "Check your bill: the due date is within 15 days of the bill's issue date."
    source_id: src_due_date
    keywords: [last, date, akhri, tareekh, due, kab, jama]

  - id: step_2
    text_ur: "بل پر شکایت کا رابطہ نمبر اور اپنے سب ڈویژن، نیپرا اور صوبائی دفتر معائنہ کے پتے درج ہوتے ہیں۔ شکایت کے لیے یہی استعمال کریں۔"
    text_en: "Your bill shows a complaint contact number and the addresses of your sub-division, NEPRA and the Provincial Office of Inspection. Use these to complain."
    source_id: src_bill_contacts
    keywords: [complaint, number, shikayat, rabta, address, pata, kahan]

  - id: step_3
    text_ur: "اگر آپ کو لگتا ہے کہ میٹر تیز چل رہا ہے تو اپنی بجلی کمپنی سے میٹر چیک کروانے کی درخواست دیں۔ کمپنی میٹر چیلنج فیس کا ڈیمانڈ نوٹس جاری کرے گی۔"
    text_en: "If you think your meter is running fast, ask your DISCO to check it. The DISCO will issue a demand notice for the meter challenge fee."
    source_id: src_meter_challenge
    keywords: [tez, check, challenge, fee, fees, kharab, karwana, karwane]

  - id: step_4
    text_ur: "فیس ادا ہونے کے بعد کمپنی سات ورکنگ دنوں کے اندر میٹر کی درستگی چیک کرے گی۔"
    text_en: "After the fee is paid, the DISCO checks the meter's accuracy within seven working days."
    source_id: src_meter_7_days
    keywords: [kitne, din, saat, working, days, check, karwane]

  - id: step_5
    text_ur: "اگر میٹر حد سے زیادہ تیز نکلے تو کمپنی اپنے خرچ پر میٹر بدلے گی اور پچھلے دو بلنگ سائیکلز تک کے اضافی یونٹس کا کریڈٹ دے گی۔"
    text_en: "If the meter is found fast beyond limits, the DISCO replaces it at its own cost and credits the excess units for up to two previous billing cycles."
    source_id: src_meter_credit
    keywords: [credit, wapas, refund, paise, units, badal]

  - id: step_6
    text_ur: "آپ صوبائی دفتر معائنہ (Electric Inspector / POI) سے بھی میٹر چیک کروا سکتے ہیں۔ اگر آپ کمپنی کو تحریری طور پر بتا دیں تو کمپنی ٹیسٹ ہونے تک میٹر نہیں اتار سکتی۔"
    text_en: "You can also ask the Electric Inspector / Provincial Office of Inspection to check the meter. If you tell the DISCO in writing, it may not remove the meter until the test is done."
    source_id: src_poi_no_removal
    keywords: [inspector, poi, utar, hata, remove]

  - id: step_7
    text_ur: "صوبائی دفتر معائنہ درخواست ملنے کے ایک ماہ کے اندر میٹر کی درستگی چیک کرے گا۔"
    text_en: "The Provincial Office of Inspection checks the meter's accuracy within one month of the request."
    source_id: src_poi_one_month
    keywords: [inspector, poi, mahina, kitne, din]

  - id: step_8
    text_ur: "غلط بلنگ کے خلاف نیپرا میں شکایت درج کروائی جا سکتی ہے، لیکن شکایت کے دوران موجودہ بل باقاعدگی سے ادا کرتے رہیں۔"
    text_en: "You can complain to NEPRA about wrong billing, but keep paying your current bills regularly while the complaint is pending."
    source_id: src_keep_paying
    keywords: [nepra, shikayat, ada, paying, jama, dauran]

sources:
  - id: src_due_date
    title: "NEPRA Consumer Service Manual 2020, clause 6.5"
    url: "https://nepra.org.pk/Legislation/7-Manuals/7.1.1%20Consumer%20Service%20Manual%202020/TCD-10%20REVISED%20CONSUMER%20SERVICE%2008-07-20%2017081-32.pdf"
    quote: "The due date for payment of bills shall be within fifteen (15) days from the issue date of the bills."

  - id: src_bill_contacts
    title: "NEPRA Consumer Service Manual 2020, clause 6.4"
    url: "https://nepra.org.pk/Legislation/7-Manuals/7.1.1%20Consumer%20Service%20Manual%202020/TCD-10%20REVISED%20CONSUMER%20SERVICE%2008-07-20%2017081-32.pdf"
    quote: "contact number for Complaint"

  - id: src_meter_challenge
    title: "NEPRA Consumer Service Manual 2020, clause 4.3.4"
    url: "https://nepra.org.pk/Legislation/7-Manuals/7.1.1%20Consumer%20Service%20Manual%202020/TCD-10%20REVISED%20CONSUMER%20SERVICE%2008-07-20%2017081-32.pdf"
    quote: "will issue a demand notice as meter challenge fee"

  - id: src_meter_7_days
    title: "NEPRA Consumer Service Manual 2020, clause 4.3.4(b)"
    url: "https://nepra.org.pk/Legislation/7-Manuals/7.1.1%20Consumer%20Service%20Manual%202020/TCD-10%20REVISED%20CONSUMER%20SERVICE%2008-07-20%2017081-32.pdf"
    quote: "within seven working days from the date of receipt of payment of such challenge fee"

  - id: src_meter_credit
    title: "NEPRA Consumer Service Manual 2020, clause 4.3.4(d)"
    url: "https://nepra.org.pk/Legislation/7-Manuals/7.1.1%20Consumer%20Service%20Manual%202020/TCD-10%20REVISED%20CONSUMER%20SERVICE%2008-07-20%2017081-32.pdf"
    quote: "due credit be given for excessive units up to two previous billing cycles"

  - id: src_poi_no_removal
    title: "NEPRA Consumer Service Manual 2020, clause 4.3.5"
    url: "https://nepra.org.pk/Legislation/7-Manuals/7.1.1%20Consumer%20Service%20Manual%202020/TCD-10%20REVISED%20CONSUMER%20SERVICE%2008-07-20%2017081-32.pdf"
    quote: "shall not remove or take off the impugned metering installation"

  - id: src_poi_one_month
    title: "NEPRA Consumer Service Manual 2020, clause 4.3.5(b)"
    url: "https://nepra.org.pk/Legislation/7-Manuals/7.1.1%20Consumer%20Service%20Manual%202020/TCD-10%20REVISED%20CONSUMER%20SERVICE%2008-07-20%2017081-32.pdf"
    quote: "Electric Inspector/POI shall carry out checking of the accuracy of the metering installation"

  - id: src_keep_paying
    title: "NEPRA Consumer Service Manual 2020, clause 8.2.6"
    url: "https://nepra.org.pk/Legislation/7-Manuals/7.1.1%20Consumer%20Service%20Manual%202020/TCD-10%20REVISED%20CONSUMER%20SERVICE%2008-07-20%2017081-32.pdf"
    quote: "However, the consumer will continue to pay current bills regularly."
