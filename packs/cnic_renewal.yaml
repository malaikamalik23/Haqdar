  - id: src_documents
    title: "NADRA: Renew your card, user guidelines"
    url: "https://www.nadra.gov.pk/assests/downloadsPdf/renewal-guidelines.pdf"
    quote: "upload necessary documents to support the renewal application"

  - id: src_payment
    title: "NADRA: Renew your card, user guidelines"
    url: "https://www.nadra.gov.pk/assests/downloadsPdf/renewal-guidelines.pdf"
    quote: "the applicant will be notified to make a payment"
