# Runs the whole Haqdar project:  docker compose up --build
# Then open http://localhost:5500 . The first start takes a minute while the search model loads.
name: haqdar

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: haqdar-api:local
    ports:
      # Only this computer can reach the API. Remove "127.0.0.1:" to expose it on a server.
      - "127.0.0.1:8000:8000"
    environment:
      HAQDAR_ENV: ${HAQDAR_ENV:-development}
      HAQDAR_ALLOWED_ORIGINS: ${HAQDAR_ALLOWED_ORIGINS:-http://localhost:5500,http://127.0.0.1:5500}
      HAQDAR_TRUST_PROXY: ${HAQDAR_TRUST_PROXY:-0}
      HAQDAR_HSTS: ${HAQDAR_HSTS:-0}
    read_only: true            # the container's filesystem cannot be written to
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    cap_drop:
      - ALL                    # no special Linux privileges
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    restart: unless-stopped

  web:
    # Serves the web app. It is plain static files, so a small Python server is enough.
    image: python:3.11-slim
    command: ["python", "-m", "http.server", "5500", "--bind", "0.0.0.0", "--directory", "/site"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    user: "10001:10001"
    volumes:
      - ./web:/site:ro
    ports:
      - "127.0.0.1:5500:5500"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    restart: unless-stopped
