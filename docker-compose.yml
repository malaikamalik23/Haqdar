# Runs the Haqdar API in a locked-down container:  docker compose up --build
# Then open the web app (python -m http.server 5500 inside web/) and use it as usual.
name: haqdar

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: haqdar-api:local
    ports:
      # Only this computer can reach the API. Remove "127.0.0.1:" to expose it on a server.
      - "127.0.0.1:8000:8000"
    environment:
      HAQDAR_ENV: ${HAQDAR_ENV:-development}
      HAQDAR_ALLOWED_ORIGINS: ${HAQDAR_ALLOWED_ORIGINS:-http://localhost:5500,http://127.0.0.1:5500}
      HAQDAR_TRUST_PROXY: ${HAQDAR_TRUST_PROXY:-0}
      HAQDAR_HSTS: ${HAQDAR_HSTS:-0}
      # Secrets are passed at run time from your .env file, never baked into the image.
      # LLM_API_KEY: ${LLM_API_KEY:-}
    read_only: true            # the container's filesystem cannot be written to
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL                    # no special Linux privileges
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped