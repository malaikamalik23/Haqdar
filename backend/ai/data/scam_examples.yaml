# Small labelled set for the K5 scam-language classifier (owner: Malaika Khan).
# All examples are SYNTHETIC, written by the team for this prototype, with fake
# names and numbers. label: 1 = scam / pressure language, 0 = normal official-style text.
# Languages: en, roman (Roman Urdu), ur (Urdu script).

